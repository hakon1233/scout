<!doctype html><html><head><meta charset="utf8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e7e0d2;font-family:Inter,system-ui,sans-serif;color:#1c1a17;padding:40px}
.label{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6f685d}
/* header-scale simulation */
.header-sim{display:flex;align-items:center;gap:18px;height:60px;padding:0 22px;background:#f6f2ea;border:1px solid #d8d0c1;border-radius:10px}
.header-sim svg{height:28px;width:auto;display:block}
.header-sim .nav{margin-left:auto;display:flex;gap:20px}
.header-sim .nav span{font-size:13px;color:#6f685d}
.paper{background:#f6f2ea;border:1px solid #d8d0c1;border-radius:10px;display:flex;align-items:center;justify-content:center}
.paper svg{height:64px;width:auto;display:block}
.paper.sm svg{height:28px}

  .wrap{width:900px}
  .card{background:#fffdf8;border:1px solid #d8d0c1;border-radius:16px;padding:32px;margin-top:14px}
  h1{font-family:"Fraunces",serif;font-size:26px;font-weight:600}
  .ratio{color:#46413a;font-size:14px;line-height:1.5;max-width:640px;margin-top:6px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  .block .label{margin-bottom:8px}
  .tall{min-height:120px}
  </style></head><body><div class="wrap">
    <div class="label">Scout logo — concept 02</div>
    <div class="card">
      <h1>Trail Monogram</h1>
      <div class="ratio">An 'S' drawn as a scouting trail that ends in a signal-red node — the scout's route to the one thing that matters. Strong app-icon.</div>
      <div class="block" style="margin-top:22px"><div class="label">In the app header (28px)</div><div class="header-sim"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Scout">
  
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#1c1a17"/>
  <path d="M43 23 C43 16 22 15 22 25 C22 34 42 32 42 41 C42 51 21 50 21 42"
        fill="none" stroke="#f6f2ea" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="43" cy="23" r="4.5" fill="#9a3b2e"/>
</svg><div class="nav"><span>Brief</span><span>Topics</span><span>Settings</span></div></div></div>
      <div class="row">
        <div class="block"><div class="label">Signal-red on paper</div><div class="paper tall"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" width="300" height="72" role="img" aria-label="Scout">
  
  <style>.wm{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:42px;letter-spacing:-0.5px;}</style>
  <g transform="translate(8,8) scale(0.875)">
    <rect x="2" y="2" width="60" height="60" rx="15" fill="#1c1a17"/>
    <path d="M43 23 C43 16 22 15 22 25 C22 34 42 32 42 41 C42 51 21 50 21 42"
          fill="none" stroke="#f6f2ea" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="43" cy="23" r="4.5" fill="#9a3b2e"/>
  </g>
  <text class="wm" x="78" y="49" fill="#1c1a17">Scout</text>
</svg></div></div>
        <div class="block"><div class="label">Ink-only (mono degrade)</div><div class="paper tall"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Scout">
  
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14" fill="none" stroke="#1c1a17" stroke-width="2.5"/>
  <path d="M43 23 C43 16 22 15 22 25 C22 34 42 32 42 41 C42 51 21 50 21 42"
        fill="none" stroke="#1c1a17" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="43" cy="23" r="4.5" fill="#1c1a17"/>
</svg></div></div>
      </div>
    </div>
  </div></body></html>
