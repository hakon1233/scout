name: Test & Deploy to GitHub Pages

# Every push to main runs the full guard suite FIRST; the Pages deploy only
# happens if it's green (PER-120). A red unit/contract (PER-118), E2E (PER-119),
# or tarball-vs-dist drift (PER-111/PER-120) check blocks the deploy outright —
# this is what ends the manual-dogfood era: tests now gate what ships.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate: typecheck + lint + companion unit/contract suite + headless E2E.
  # Fully offline — no real Anthropic/Exa key; the `claude` shell-out is stubbed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from the "packageManager" field in package.json
      # (pnpm@11.x) — the same pnpm major the lockfile is frozen under. Pinning
      # an older major here breaks --frozen-lockfile (AIR-624).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Companion unit + /v0 API contract suite (PER-118), hermetic/offline.
      - run: pnpm test
      # Headless Playwright E2E of the zero-prompt first-run loop (PER-119). It
      # packs + boots the artifact with a stubbed `claude` binary, so it needs
      # Chromium but no API keys and no network.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  build:
    # Hard gate: a red `test` job means no build and therefore no deploy.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from the "packageManager" field in package.json
      # (pnpm@11.x) — the same pnpm major the lockfile is frozen under. Pinning
      # an older major here breaks --frozen-lockfile (AIR-624).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      # Rebuild + repack the companion tarball from src/ on every deploy so the
      # blob served at /agent/scout-agent-<v>.tgz can never lag the source
      # (PER-113 #3 — a hand-committed tarball nearly shipped stale onboarding
      # in PER-111). pack:agent runs build:agent (webroot + agent compile) then
      # npm pack into public/agent/, which `pnpm build` copies into out/.
      - run: pnpm run pack:agent
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Stale-artifact guard (PER-120, PER-111 lesson): the `dist` that SHIPS
      # inside the just-packed tarball must be byte-identical to the freshly
      # built packages/agent/dist. If they drift, fail the build — "done in
      # code ≠ shipped in the tarball."
      - run: pnpm run check:tarball-dist
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
