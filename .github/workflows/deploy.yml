name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      # Rebuild + repack the companion tarball from src/ on every deploy so the
      # blob served at /agent/scout-agent-<v>.tgz can never lag the source
      # (PER-113 #3 — a hand-committed tarball nearly shipped stale onboarding
      # in PER-111). pack:agent runs build:agent (webroot + agent compile) then
      # npm pack into public/agent/, which `pnpm build` copies into out/.
      - run: pnpm run pack:agent
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
