name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Hermetic @scout/agent unit + /v0 contract suite (PER-118). Mocks the
      # `claude` shell-out, so it runs offline with zero quota and guards the
      # known regressions (PER-91/92/106/108/110/113) on every push/PR.
      - run: pnpm test
      - run: pnpm build
