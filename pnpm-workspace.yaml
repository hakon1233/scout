packages:
  - "."
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Floors for transitive dependencies with security advisories, kept inside
# each package's current major.
overrides:
  "@babel/core": "^7.29.6"
  baseline-browser-mapping: "^2.11.0"
  brace-expansion@<2: "^1.1.21"
  brace-expansion@>=5 <6: "^5.0.12"
  browserslist: "^4.28.7"
  esbuild: ">=0.28.1"
  js-yaml: "^4.3.2"
  nanoid@<4: "^3.3.18"
  postcss: "^8.5.23"
